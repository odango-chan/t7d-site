name: Novel Release Contracts

on:
  workflow_dispatch:
  push:
    paths:
      - "src/content/novel/**"
      - "src/pages/novel/**"
      - "src/styles/reader.css"
      - "tools/checks/validate-novel-release.py"
      - ".github/workflows/novel-contracts.yml"
  pull_request:
    paths:
      - "src/content/novel/**"
      - "src/pages/novel/**"
      - "src/styles/reader.css"
      - "tools/checks/validate-novel-release.py"
      - ".github/workflows/novel-contracts.yml"

jobs:
  validate-novel-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site
        uses: actions/checkout@v5

      - name: Checkout upstream production source
        uses: actions/checkout@v5
        with:
          repository: odango-chan/touhou-seven-days
          path: .upstream
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate release provenance and public prose
        run: python tools/checks/validate-novel-release.py --upstream-root .upstream
